name = "match-history-api"
main = "src/index.ts"
compatibility_date = "2024-10-01"

# Cloudflare R2 오브젝트 스토리지 바인딩 (AWS S3 호환, Egress $0)
[[r2_buckets]]
binding = "REPLAY_BUCKET"
bucket_name = "match-history-replays"

# Cloudflare D1 서버리스 데이터베이스 바인딩
[[d1_databases]]
binding = "DB"
database_name = "match-history-db"
database_id = "2b2bf5ac-9c9d-4f34-a078-cfbe20d686a5"
